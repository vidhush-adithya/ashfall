# ASHFALL — mako
font=JetBrainsMono Nerd Font 10
background-color=#{{panel}}f0
text-color=#{{fg}}
border-color=#{{grit}}
progress-color=over #{{accent}}
border-size=2
border-radius=2
padding=12,14
margin=12
width=380
height=160
anchor=top-right
default-timeout=6000
max-visible=4
icons=1
max-icon-size=40
format=<b>%s</b>\n%b

[urgency=low]
text-color=#{{dim}}

[urgency=high]
border-color=#{{bad}}
default-timeout=0

[app-name=ASHFALL]
border-color=#{{accent}}

[app-name="FLAG"]
border-color=#{{accent2}}
text-color=#{{hi}}
