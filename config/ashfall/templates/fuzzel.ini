# ASHFALL — fuzzel
[main]
font=JetBrainsMono Nerd Font:size=12
prompt="  ❯ "
placeholder=scavenge...
terminal=kitty -e
icon-theme=Papirus-Dark
icons-enabled=yes
width=44
lines=10
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=22
letter-spacing=0.5

[colors]
background={{panel}}f2
text={{fg}}ff
prompt={{accent}}ff
placeholder={{grit}}ff
input={{hi}}ff
match={{accent2}}ff
selection={{line}}ff
selection-text={{hi}}ff
selection-match={{matchhi}}ff
counter={{grit}}ff
border={{accent}}ff

[border]
width=2
radius=2
