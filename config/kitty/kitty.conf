# ASHFALL — kitty
font_family      JetBrainsMono Nerd Font
font_size        11.0
disable_ligatures cursor

background_opacity 0.93
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0

# CTF: big scrollback for long fuzz / gdb sessions
scrollback_lines 50000
copy_on_select clipboard
strip_trailing_spaces smart
url_style straight
detect_urls yes

cursor_shape block
cursor_blink_interval 0
cursor #9a8348
cursor_text_color #0c0b09

tab_bar_edge top
tab_bar_style separator
tab_separator " │ "
tab_title_template "{index}:{title}"
active_tab_foreground   #0c0b09
active_tab_background   #8b5a3c
active_tab_font_style   bold
inactive_tab_foreground #6e6657
inactive_tab_background #14120f
tab_bar_background      #0c0b09

# lets pwntools (solve.py GDB) open gdb in a split next to your exploit
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}

enabled_layouts splits,stack
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+\    launch --location=vsplit --cwd=current
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+z    toggle_layout stack
map ctrl+shift+h    neighboring_window left
map ctrl+shift+l    neighboring_window right
map ctrl+shift+k    neighboring_window up
map ctrl+shift+j    neighboring_window down

foreground            #a89f8c
background            #0c0b09
selection_foreground  #0c0b09
selection_background  #8b5a3c
url_color             #9a8348
active_border_color   #8b5a3c
inactive_border_color #2a2620

